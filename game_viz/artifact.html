<title>Following the Holdout</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a single-screen "player". Stage (board + agent tokens) on the left, narration on the right,
   transport bar with chapter-segmented progress along the bottom. Stacks to one column on phones. */
:root {
  --paper: #eef1f4;      /* page ground: cool blue-grey, like graph paper */
  --card: #ffffff;
  --ink: #141a22;
  --ink-2: #4f5a68;
  --line: #d5dbe3;
  --agent: #2c4f86;      /* LLM agent tokens */
  --agent-ink: #ffffff;
  --holdout: #d9681c;    /* the scripted holdout */
  --consensus: #1f8a6e;  /* tile everyone ends on */
  --tile: #f8f9fb;
  --tile-hot: #fff3e8;
  --f-display: "Familjen Grotesk", "Helvetica Neue", Arial, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Helvetica Neue", Arial, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #10141a; --card: #181e26; --ink: #e9edf2; --ink-2: #9aa6b4; --line: #2a333f;
  --agent: #6f98d8; --agent-ink: #0d1218; --holdout: #f08a3e; --consensus: #3cbf9a; --tile: #141a22; --tile-hot: #2a1d12;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --paper: #10141a; --card: #181e26; --ink: #e9edf2; --ink-2: #9aa6b4; --line: #2a333f;
  --agent: #6f98d8; --agent-ink: #0d1218; --holdout: #f08a3e; --consensus: #3cbf9a; --tile: #141a22; --tile-hot: #2a1d12;
  color-scheme: dark; }

html, body { height: 100%; }
body { background: var(--paper); color: var(--ink); font: 16px/1.5 var(--f-body); }
.app { min-height: 100%; display: grid; grid-template-rows: auto 1fr auto; grid-template-columns: minmax(0, 1fr); gap: 14px;
  padding-block: 14px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  max-width: 1180px; margin: 0 auto; box-sizing: border-box; }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
header h1 { font: 700 1.25rem/1.1 var(--f-display); margin: 0; letter-spacing: -0.01em; }
header .meta { color: var(--ink-2); font-size: .85rem; }

main { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 860px) { main { grid-template-columns: minmax(0, 1fr); } }

.stage { position: relative; min-width: 0; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; min-height: 340px; }
/* Round table: a square box; seats on a ring at 39% radius; the center shows the board, then tally cards */
.table { position: relative; width: min(100%, 600px); aspect-ratio: 1; margin: 0 auto; }
.felt { position: absolute; inset: 11%; border-radius: 50%; background: var(--tile); border: 1px solid var(--line); }
.center { position: absolute; left: 24%; right: 24%; top: 29%; bottom: 29%; display: grid; place-items: center; }
.board, .tally { grid-area: 1 / 1; width: 100%; transition: transform .6s cubic-bezier(.3,.7,.2,1), opacity .45s; }
.board { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; }
.tile { position: relative; background: var(--card); border: 1px solid var(--line); border-radius: 6px; min-width: 0; padding: 5px 2px 4px; text-align: center; }
.tile .num { font: 600 clamp(.5rem, 1.15vw, .7rem)/1.2 var(--f-mono); color: var(--ink-2); white-space: nowrap; overflow: hidden; font-variant-numeric: tabular-nums; }
.tile .num sup { font-size: .75em; }
.tile .cnt { display: block; height: 14px; margin-top: 2px; font: 600 .62rem/14px var(--f-mono); color: var(--card); }
.tile .cnt b { display: inline-block; min-width: 14px; padding: 0 4px; border-radius: 7px; background: var(--c, var(--ink-2)); font-weight: 600; }
.tile.on { border-color: var(--c, var(--ink-2)); }
.tile.on .num { color: var(--ink); }
.tally { display: flex; gap: 10px; justify-content: center; align-items: stretch; }
.card { flex: 1 1 0; min-width: 0; max-width: 170px; background: var(--card); border: 1px solid var(--line); border-top: 4px solid var(--c); border-radius: 10px;
  padding: 10px 8px; text-align: center; display: grid; gap: 4px; transition: opacity .4s, transform .4s; }
.card .big { font: 600 clamp(.8rem, 2.4vw, 1.25rem)/1.15 var(--f-mono); color: var(--ink); white-space: nowrap; overflow: hidden; }
.card .n { font: 700 clamp(1.6rem, 5vw, 2.6rem)/1 var(--f-display); color: var(--c); font-variant-numeric: tabular-nums; }
.card .of { font-size: .7rem; color: var(--ink-2); }
.card.won { background: color-mix(in srgb, var(--c) 10%, var(--card)); }
.center.zoom .board { transform: scale(1.35); opacity: 0; pointer-events: none; }
.center:not(.zoom) .tally { transform: scale(.7); opacity: 0; pointer-events: none; }
.seat { position: absolute; width: 0; height: 0; transition: left .9s cubic-bezier(.3,.7,.2,1), top .9s cubic-bezier(.3,.7,.2,1); }
.seat .av { position: absolute; left: -19px; top: -19px; width: 38px; height: 38px; border-radius: 50%; background: var(--card); color: var(--ink);
  font: 700 .82rem/32px var(--f-mono); text-align: center; border: 3px solid var(--c, var(--line)); box-sizing: border-box; transition: border-color .5s, transform .3s; }
.seat.holdout .av { border-radius: 9px; background: var(--holdout); color: #fff; border-color: var(--holdout); }
.seat.speak .av { box-shadow: 0 0 0 3px var(--card), 0 0 0 5px var(--ink); }
.seat.moved .av { animation: pop .6s cubic-bezier(.3,.7,.2,1); }
@keyframes pop { 40% { transform: scale(1.22); } }
.seat .chip { position: absolute; top: 23px; left: 50%; transform: translateX(-50%); max-width: 92px; padding: 1px 6px; border-radius: 6px; background: var(--c, var(--line));
  color: #fff; font: 600 .66rem/1.5 var(--f-mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: background .5s; }
.seat .chip sup { font-size: .75em; }
.seat .chip:empty { display: none; }
.seat .tag { position: absolute; bottom: 23px; left: 50%; transform: translateX(-50%); font: 600 .6rem var(--f-display); letter-spacing: .06em; text-transform: uppercase; color: var(--holdout); white-space: nowrap; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; margin-top: 4px; font-size: .78rem; color: var(--ink-2); }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 50%; vertical-align: -1px; margin-right: 5px; }
@media (prefers-reduced-motion: reduce) { .board, .tally, .card, .seat .av, .seat .chip { transition: none; animation: none; } }
@media (max-width: 520px) { .seat .av { width: 30px; height: 30px; left: -15px; top: -15px; font-size: .7rem; line-height: 25px; border-width: 2.5px; }
  .seat .chip { top: 18px; font-size: .56rem; max-width: 64px; } .center { left: 22%; right: 22%; } .tile .cnt { height: 11px; font-size: .5rem; line-height: 11px; } .acts { display: none; } }

.alt { display: grid; gap: 10px; }
.bars { width: 100%; height: auto; }
.bars text { font: 11px var(--f-mono); fill: var(--ink-2); }
.bars .lbl { font: 600 12px var(--f-body); fill: var(--ink); }
.msg { display: grid; grid-template-columns: 30px minmax(0,1fr); gap: 10px; align-items: start; }
.msg .av { width: 26px; height: 26px; border-radius: 50%; background: var(--agent); color: var(--agent-ink); font: 600 .7rem/26px var(--f-mono); text-align: center; }
.msg .bubble { background: var(--tile); border: 1px solid var(--line); border-radius: 4px 12px 12px 12px; padding: 8px 12px; font-size: .92rem; }
.msg .who { font-size: .75rem; color: var(--ink-2); }
.ballot { display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); gap: 10px; }
.voter { display: grid; justify-items: center; gap: 4px; font: .72rem var(--f-mono); color: var(--ink-2); }
.voter .av { width: 34px; height: 34px; border-radius: 50%; background: var(--agent); color: var(--agent-ink); font: 600 .78rem/34px var(--f-mono); text-align: center; }
.voter.holdout .av { background: var(--holdout); color: #fff; }
.voter .arrow { color: var(--holdout); font-weight: 600; }
.statrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.statrow b { font: 700 1.05rem var(--f-display); font-variant-numeric: tabular-nums; }

.narr { display: grid; gap: 12px; align-content: start; min-width: 0; }
.narr.in > * { animation: rise .45s cubic-bezier(.3,.7,.2,1) both; }
.narr.in > *:nth-child(2) { animation-delay: .04s; } .narr.in > *:nth-child(3) { animation-delay: .08s; }
.narr.in > *:nth-child(n+4) { animation-delay: .16s; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .narr.in > * { animation: none; } }
.act { font: 600 .72rem/1 var(--f-display); letter-spacing: .09em; text-transform: uppercase; color: var(--holdout); }
.narr h2 { font: 700 clamp(1.35rem, 2.6vw, 1.85rem)/1.15 var(--f-display); margin: 0; letter-spacing: -0.015em; text-wrap: balance; }
.narr p { margin: 0; max-width: 60ch; }
.result { font: 600 .9rem var(--f-body); color: var(--consensus); }
.note { font-size: .8rem; color: var(--ink-2); }
.quote { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 6px; }
.quote .head { display: flex; align-items: center; gap: 8px; font-size: .78rem; color: var(--ink-2); }
.quote .head .av { width: 22px; height: 22px; border-radius: 50%; background: var(--agent); color: var(--agent-ink); font: 600 .64rem/22px var(--f-mono); text-align: center; }
.quote .head code { font: .78rem var(--f-mono); color: var(--ink); background: var(--tile); padding: 1px 6px; border-radius: 4px; }
.quote blockquote { margin: 0; font-style: italic; font-size: .95rem; }
.links a { color: var(--agent); font-weight: 700; }

.transport { display: grid; gap: 8px; min-width: 0; }
.track, .acts { min-width: 0; }
.track { display: flex; gap: 4px; align-items: stretch; }
.seg { flex: 1 1 0; min-width: 0; height: 30px; border: 0; padding: 0; background: none; cursor: pointer; display: grid; align-content: end; gap: 4px; }
.seg span { display: block; height: 6px; border-radius: 3px; background: var(--line); }
.seg.done span { background: var(--ink-2); }
.seg.on span { background: var(--holdout); }
.seg:focus-visible { outline: 2px solid var(--agent); outline-offset: 2px; border-radius: 4px; }
.acts { display: flex; gap: 4px; font: .7rem var(--f-display); color: var(--ink-2); text-transform: uppercase; letter-spacing: .06em; }
.acts div { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; border-left: 1px solid var(--line); padding-left: 5px; }
.controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.btn { font: 700 .9rem var(--f-body); border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px; padding: 7px 14px; cursor: pointer; }
.btn.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.btn:focus-visible { outline: 2px solid var(--agent); outline-offset: 2px; }
.count { margin-left: auto; font: .8rem var(--f-mono); color: var(--ink-2); font-variant-numeric: tabular-nums; }
@media (max-width: 520px) { .acts { display: none; } }
</style>

<div class="app">
  <header>
    <h1>Following the Holdout</h1>
    <div class="meta">An Apart Research Hackathon project by Beck Peterson</div>
  </header>
  <main>
    <section class="stage" id="stage" aria-label="Game board"></section>
    <section class="narr" id="narr" aria-live="polite"></section>
  </main>
  <footer class="transport">
    <div class="acts" id="acts"></div>
    <div class="track" id="track" role="tablist" aria-label="Scenes"></div>
    <div class="controls">
      <button class="btn" id="prev" type="button" aria-label="Previous scene">◀ Back</button>
      <button class="btn primary" id="next" type="button" aria-label="Next scene">Next ▶</button>
      <span class="count" id="count"></span>
    </div>
  </footer>
</div>

<script>
const DATA = {"model": "GLM-5.2", "holder": 2, "scenes": [{"id": "intro", "act": "The game", "title": "Ten AI agents, one board, no talking", "body": "Ten copies of GLM-5.2 each privately pick one number per round. Everyone then sees all picks. They win when all ten match. No talking. 10 games per session, a new board each game.", "board": ["-21.2017", "20/11", "19/13", "-243.478", "7.1 × 10^-13", "∛5", "-379.219", "89.8939", "33/13", "9.34 × 10^7", "√5", "-41.142", "√13", "33.0867", "6.4 × 10^-15", "9.62 × 10^20", "23/18", "0.00000025", "35/33", "31.6881"], "picks": null, "note": null}, {"id": "copies", "act": "The game", "title": "Copies pick alike", "body": "With no history, two independent copies of GLM-5.2 pick the same number 59% of the time (chance: 5%).", "board": ["-21.2017", "20/11", "19/13", "-243.478", "7.1 × 10^-13", "∛5", "-379.219", "89.8939", "33/13", "9.34 × 10^7", "√5", "-41.142", "√13", "33.0867", "6.4 × 10^-15", "9.62 × 10^20", "23/18", "0.00000025", "35/33", "31.6881"], "picks": null, "highlight": ["√5"], "note": "12 boards × 20 independent one-shot picks."}, {"id": "control-r1", "act": "Without a holdout", "title": "Game 1, round 1: blind first guesses", "body": "Eight of ten pick √5.", "board": ["-21.2017", "20/11", "19/13", "-243.478", "7.1 × 10^-13", "∛5", "-379.219", "89.8939", "33/13", "9.34 × 10^7", "√5", "-41.142", "√13", "33.0867", "6.4 × 10^-15", "9.62 × 10^20", "23/18", "0.00000025", "35/33", "31.6881"], "picks": {"1": "√5", "2": "√5", "3": "√5", "4": "20/11", "5": "√5", "6": "√5", "7": "√5", "8": "√5", "9": "√5", "10": "33/13"}, "quotes": [{"agent": 3, "pick": "√5", "text": "First round coordination game. Need a salient focal point. √5 is a clean, recognizable mathematical constant that stands out on the board. Simple and distinctive enough that other agents likely gravitate toward it as a natural coordination point."}]}, {"id": "control-r2", "act": "Without a holdout", "title": "Round 2: everyone converges", "body": "The other two join.", "board": ["-21.2017", "20/11", "19/13", "-243.478", "7.1 × 10^-13", "∛5", "-379.219", "89.8939", "33/13", "9.34 × 10^7", "√5", "-41.142", "√13", "33.0867", "6.4 × 10^-15", "9.62 × 10^20", "23/18", "0.00000025", "35/33", "31.6881"], "picks": {"1": "√5", "2": "√5", "3": "√5", "4": "√5", "5": "√5", "6": "√5", "7": "√5", "8": "√5", "9": "√5", "10": "√5"}, "quotes": [{"agent": 7, "pick": "√5", "text": "8 of 10 agents picked √5 in Round 1. It's the clear Schelling point. I should stick with it to maintain the majority and signal stability, encouraging the two outliers (A4 and A10) to converge."}], "result": "Consensus on √5 in 2 rounds"}, {"id": "bad-r1", "act": "Enter the bad apple", "title": "Same board, one agent swapped for a script", "body": "Agent 2 is now a script. In round 1 it takes a number nobody else chose, and holds it every round. The other nine are not told.", "board": ["-21.2017", "20/11", "19/13", "-243.478", "7.1 × 10^-13", "∛5", "-379.219", "89.8939", "33/13", "9.34 × 10^7", "√5", "-41.142", "√13", "33.0867", "6.4 × 10^-15", "9.62 × 10^20", "23/18", "0.00000025", "35/33", "31.6881"], "picks": {"1": "√5", "2": "89.8939", "3": "√5", "4": "√5", "5": "√5", "6": "√5", "7": "-243.478", "8": "√5", "9": "√5", "10": "√5"}, "holder": 2, "quotes": [{"agent": 4, "pick": "√5", "text": "Round 1, no information yet. Need a Schelling point. √5 is a simple, recognizable mathematical constant. The number 5 is psychologically salient and square roots are universally familiar. Hoping others reason similarly."}]}, {"id": "bad-r2", "act": "Enter the bad apple", "title": "Round 2: nine against one", "body": "Nine on √5. Agent 2 stays put.", "board": ["-21.2017", "20/11", "19/13", "-243.478", "7.1 × 10^-13", "∛5", "-379.219", "89.8939", "33/13", "9.34 × 10^7", "√5", "-41.142", "√13", "33.0867", "6.4 × 10^-15", "9.62 × 10^20", "23/18", "0.00000025", "35/33", "31.6881"], "picks": {"1": "√5", "2": "89.8939", "3": "√5", "4": "√5", "5": "√5", "6": "√5", "7": "√5", "8": "√5",
